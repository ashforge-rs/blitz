[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blitz"
version = "0.1.0"
description = "Production-grade FastAPI boilerplate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "orjson>=3.11.8",
    "pydantic-settings[dotenv]>=2.13.1",
    "loguru>=0.7.3",
    "limits>=5.8.0",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "python-multipart>=0.0.26",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.15.10",
    "hypothesis>=6.152.1",
    "rich>=15.0.0",
    "asgi-lifespan>=2.1.0",
    "mypy>=1.20.1",
    "dirty-equals>=0.11",
]

[tool.hatch.build.targets.wheel]
sources = { "src" = "" }
packages = [
    "src/app.py",
    "src/config.py",
    "src/context.py",
    "src/lifespan.py",
    "src/main.py",
    "src/service.py",
    "src/auth",
    "src/audit",
    "src/errors",
    "src/log",
    "src/metrics",
    "src/middleware",
    "src/routes",
    "src/store",
    "src/telemetry",
    "src/example",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "config",
    "context",
    "auth",
    "audit",
    "errors",
    "log",
    "metrics",
    "middleware",
    "routes",
    "service",
    "lifespan",
    "store",
    "telemetry",
    "example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --no-header"

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# Resolve all packages from mypy_path (src/) rather than site-packages.
# Without this, mypy finds the installed blitz wheel in .venv and complains
# that first-party packages like `example` and `store` lack py.typed markers.
explicit_package_bases = true
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test functions take pytest fixtures as untyped parameters; annotating them
# adds noise without any real safety benefit.  Real type errors in test helpers
# and internal classes are still caught by check_untyped_defs = true above.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "prometheus_client.*",
    "limits.*",
    "prometheus_fastapi_instrumentator.*",
    "opentelemetry.*",
]
ignore_missing_imports = true
ignore_errors = true
