# ══════════════════════════════════════════════════════════════════════════════
# Release Please workflow
# ══════════════════════════════════════════════════════════════════════════════
# Runs on every push to master.
#
# What release-please does:
#   • Parses Conventional Commit messages since the last release tag.
#   • Opens (or updates) a "Release PR" that bumps the version in
#     .release-please-manifest.json and prepends a CHANGELOG section.
#   • When that PR is merged, it creates a GitHub Release + git tag.
#
# Configuration files:
#   release-please-config.json        — package type, changelog sections, etc.
#   .release-please-manifest.json     — current version(s) per component
#
# After a release is created this workflow:
#   1. Builds a Python distribution (wheel + sdist) via `uv build`.
#   2. (Optional) Publishes to PyPI — uncomment the step below.
#   3. Rebuilds and pushes versioned Docker images for all services.
# ══════════════════════════════════════════════════════════════════════════════

name: Release Please

# on:
#     push:
#         branches: ["master"]

# Must stay in sync with PYTHON_PRIMARY in ci.yml.
env:
    PYTHON_PRIMARY: "3.12"

# release-please needs write access to open PRs and create releases.
# docker-release/publish inherit these permissions via `secrets: inherit`.
permissions:
    contents: write
    pull-requests: write

jobs:
    # ──────────────────────────────────────────────────────────────────────────
    # release-please — maintain the release PR and create GitHub Releases.
    #
    # This job always runs on every master push.  It is a no-op when there are
    # no releasable commits since the last tag.
    # ──────────────────────────────────────────────────────────────────────────
    release-please:
        runs-on: ubuntu-latest
        outputs:
            # release_created is 'true' only when a Release PR was just merged.
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }} # e.g. "v1.2.3"
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            # The remaining steps only run when a release was actually created.
            - uses: actions/checkout@v6
              if: ${{ steps.release.outputs.release_created }}

            - uses: astral-sh/setup-uv@v8.0.0
              if: ${{ steps.release.outputs.release_created }}
              with:
                  version: "latest"
                  enable-cache: true
                  python-version: ${{ env.PYTHON_PRIMARY }}

            # Build a wheel + sdist.  Artifacts land in dist/.
            - name: Build distribution
              if: ${{ steps.release.outputs.release_created }}
              run: uv build

            # ── Optional: upload dist/ as a GitHub Release asset ──────────────
            # - name: Upload dist to GitHub Release
            #   if: ${{ steps.release.outputs.release_created }}
            #   uses: softprops/action-gh-release@v2
            #   with:
            #     tag_name: ${{ steps.release.outputs.tag_name }}
            #     files: dist/*

            # ── Optional: publish to PyPI ─────────────────────────────────────
            # Requires a PyPI API token stored as the PYPI_TOKEN repository secret.
            # See https://docs.astral.sh/uv/guides/publish/ for setup instructions.
            # - name: Publish to PyPI
            #   if: ${{ steps.release.outputs.release_created }}
            #   env:
            #       UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
            #   run: uv publish

            # ── Optional: publish to TestPyPI first ───────────────────────────
            # Useful for validating the package before it hits the real index.
            # - name: Publish to TestPyPI
            #   if: ${{ steps.release.outputs.release_created }}
            #   env:
            #       UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
            #   run: uv publish --index https://test.pypi.org/legacy/

    # ──────────────────────────────────────────────────────────────────────────
    # docker-release — discover all services and prepare for versioned publish.
    #
    # Skipped unless a release was actually created by the job above.
    # Enumerates every src/services/<name>/Dockerfile to build the matrix.
    # ──────────────────────────────────────────────────────────────────────────
    docker-release:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        outputs:
            services: ${{ steps.discover.outputs.services }}
        steps:
            - uses: actions/checkout@v6

            - name: Discover services with Dockerfiles
              id: discover
              shell: bash
              run: |
                  # Walk src/services/ and collect directory names that contain a Dockerfile.
                  SERVICES_JSON="["
                  FIRST=true
                  for svc in $(find src/services -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort); do
                      [[ ! -f "src/services/$svc/Dockerfile" ]] && continue
                      $FIRST || SERVICES_JSON+=","
                      SERVICES_JSON+="\"$svc\""
                      FIRST=false
                  done
                  SERVICES_JSON+="]"
                  echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
                  echo "Publishing images for: $SERVICES_JSON"

    # ──────────────────────────────────────────────────────────────────────────
    # publish — push a versioned image for every service.
    #
    # Calls the reusable docker-build.yml workflow in a matrix so services
    # build in parallel.  Each image is tagged with:
    #   • sha-<short-sha>  (always)
    #   • latest           (master branch)
    #   • <tag_name>       (e.g. "v1.2.3" — the release semver)
    #
    # To disable versioned Docker publishes on release, comment out this job.
    # ──────────────────────────────────────────────────────────────────────────
    publish:
        needs: docker-release
        if: ${{ needs.docker-release.outputs.services != '[]' }}
        strategy:
            fail-fast: false # publish remaining services even if one fails
            matrix:
                service: ${{ fromJson(needs.docker-release.outputs.services) }}
        uses: ./.github/workflows/docker-build.yml
        with:
            service: ${{ matrix.service }}
            push: true
            # Pass the semver tag (e.g. "v1.2.3") so the image gets that tag
            # in addition to sha-* and latest.
            extra_tags: ${{ needs.release-please.outputs.tag_name }}
        secrets: inherit
