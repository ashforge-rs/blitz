apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false

  # The dashboards pick their database with a datasource variable (regex on the name).
  - name: Todo database
    type: grafana-postgresql-datasource
    uid: todo-db
    url: postgres:5432
    user: examples
    secureJsonData:
      password: examples
    jsonData:
      database: todo
      sslmode: disable
      postgresVersion: 1700
    editable: false

  - name: Consent database
    type: grafana-postgresql-datasource
    uid: consent-db
    url: postgres:5432
    user: examples
    secureJsonData:
      password: examples
    jsonData:
      database: consent
      sslmode: disable
      postgresVersion: 1700
    editable: false
