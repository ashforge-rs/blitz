services:
  app:
    build:
      context: .
      target: builder          # use the builder stage so src/ is editable
    command: >
      uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --loop asyncio
        --log-level debug
    volumes:
      - ./src:/app/src          # live-reload source changes without rebuild
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      RATE_LIMIT: "1000/minute"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-data:
