[project]
name = "blitz-cli"
version = "0.1.0"
description = "Code generator and boilerplate manager for blitz projects"
requires-python = ">=3.15"
dependencies = [
  "typer>=0.20",
  # Generated files are import-sorted and formatted with the project's Ruff config.
  "ruff>=0.17.6",
]

[project.scripts]
blitz = "blitz_cli.main:main"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blitz_cli"]

[tool.uv]
required-version = "~=0.13.7"

# ── Ruff: blitz's rules, this project's paths ────────────────────────────────
[tool.ruff]
extend = "../pyproject.toml"
src = ["."]
# Templates are not Python until rendered; the generated files are checked in place.
extend-exclude = ["blitz_cli/templates"]

[tool.ruff.lint.per-file-ignores]
"blitz_cli_tests/**" = ["ANN", "ERA", "TRY", "EM", "PTH", "TCH", "S101"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.15"
explicit_package_bases = true
strict = true
warn_unreachable = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["blitz_cli_tests.*"]
# Test helpers take fixtures and paths untyped, as in the root project's tests.
disallow_untyped_defs = false
disallow_untyped_calls = false

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["blitz_cli_tests"]
addopts = "-q --no-header --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
